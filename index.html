<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>30 Seconds</title>
</head>
<body>
  <main class="wrap">
    <h1>30 Seconds Scheikunde SSL</h1>

  <label class="field">
    <span>Niveau</span>
    <select id="level">
      <option value="VWO" selected>VWO</option>
      <option value="HAVO">HAVO</option>
    </select>
  </label>    

    <section class="controls">
      <label>
        Lengte Cursus
        <select id="course">
          <option value="2">2-daagse</option>
          <option value="3">3-daagse</option>
        </select>
      </label>

      <label>
        Dag
        <select id="day"></select>
      </label>

      <button id="renew">Nieuw!</button>
    </section>

    <section class="card">
      
      <h2>Card</h2>
      <ul id="items" class="items"></ul>
      <p class="hint">Tap an item to cross it out.</p> 
    </section>

    <div class="cardTop">
      <span id="timer" class="pill">30s</span>
      <button id="timer-start">▶ Start</button>
    </div>
  </main>



  <script src="app.js"></script>
  <script>
    // register service worker for offline use
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
